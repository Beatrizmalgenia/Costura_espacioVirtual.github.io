		<script type="module">

			import * as THREE from 'three';

			var camera, scene, renderer;
            const container = document.getElementById( 'container' );      
			const boxInfo = document.querySelector('.boxInfoSpot');
			let boxInfoActive = false;
            
            
            let phi = 0, theta = 0;
            let nZoom=0; let objectSelected=0; let firstObject=1;
            var xObject,yObject,zObject; 
            
            //para detectar cuando el mouse pasa por los objetos
            const raycaster = new THREE.Raycaster();
            const mousePointer = new THREE.Vector2();//normalización del 3D en dos cordenadas del mouse
            var soundCollitions;
			var linkCollitions;
            var inicializando;
            var objeto= null;
            var intersectsSound = null;
			var intersectsLinks = null;
            
            //arreglo de páginas a las que se desplaza
            var pages= new Array("index3_1.html","360_InfoSpot.html");
            var audios= new Array("sounds/AudioNicolOgg.ogg","sounds/AudioSusaOgg.ogg","sounds/AudioGloriOgg.ogg","sounds/AudioLeyOgg.ogg","sounds/AudioMargaritaOgg.ogg","sounds/AudioMariaOgg.ogg");
            let audio= false;
            //var audio = new Audio('sounds/AudioSusa.wav');
            
			init();
			animate();

			function init() {

				inicializando=1;
                //el último parámetro es el alcance, si más pequeño que el ancho de la esfera, no pintará lo más lejos de la esfera
				camera = new THREE.PerspectiveCamera( 60, window.innerWidth / window.innerHeight, 0.1, 200 );
				scene = new THREE.Scene();
                camera.position.set(1,0,0);
                
                const listener = new THREE.AudioListener();
                camera.add( listener );
                const sound = new THREE.Audio( listener );
                
                
                
                const GlobalGeometry = new THREE.SphereGeometry( 50, 32, 32 );
				GlobalGeometry.scale( - 1, 1, 1 );
	            const texture = new THREE.TextureLoader().load( 'img/EspacioVRCosturero_objetos.jpg' );
				const material = new THREE.MeshBasicMaterial( { map: texture } );
				const mesh = new THREE.Mesh( GlobalGeometry, material );
				scene.add( mesh );
                
           
                
            //Mesa
                const geometry = new THREE.PlaneGeometry( 1, 1 ); 
                const texturePlane = new THREE.TextureLoader().load( 'img/B_info.png' );
                const materialBoton2 = new THREE.MeshBasicMaterial( { map: texturePlane, transparent:true, side: THREE.DoubleSide} );
                const plane = new THREE.Mesh( geometry, materialBoton2 );
                scene.add( plane );
                plane.position.z = 20;
                plane.position.x = 6;
                plane.name="0";
               
                //ventana
                const plane1 = new THREE.Mesh( geometry, materialBoton2 );
                scene.add( plane1 );
                plane1.position.z = 8;
                plane1.position.x = -15;
                plane1.position.y = -1;
                 plane1.rotation.y = 2;
                plane1.name="1";                
               
                
                //materas
                const plane2 = new THREE.Mesh( geometry, materialBoton2 );
                scene.add( plane2 );
                plane2.position.z =1;
                plane2.position.x = -15;
                plane2.position.y = 10;
                plane2.rotation.y = 2;
                plane2.name="2"; 
                
                //bolardos
                const plane3 = new THREE.Mesh( geometry, materialBoton2 );
                scene.add( plane3 );
                plane3.position.z =-15;
                plane3.position.x = -10;
                plane3.position.y = 0;
                plane3.rotation.y = 4;
                plane3.name="3";   
               
                //jaula
                const plane4 = new THREE.Mesh( geometry, materialBoton2 );
                scene.add( plane4 );
                plane4.position.z =-8;
                plane4.position.x = 15;
                plane4.position.y = 2;
                plane4.rotation.y =-1;
                plane4.name="4";   
                
                //perra
                const plane5 = new THREE.Mesh( geometry, materialBoton2 );
                scene.add( plane5 );
                plane5.position.z =-2;
                plane5.position.x = 0;
                plane5.position.y = -10;
                plane5.rotation.x = 2;
                plane5.name="5"; 
               
                soundCollitions = [plane,plane1, plane2, plane3, plane4, plane5];
                
                
                const selectedMaterial = new THREE.MeshBasicMaterial({ color: 0xE0C4A8});
                
				renderer = new THREE.WebGLRenderer();
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				container.appendChild( renderer.domElement );

      
                
				container.style.touchAction = 'none';
				container.addEventListener( 'pointerdown', onPointerDown );

				document.addEventListener( 'wheel', onDocumentMouseWheel );
              document.addEventListener( 'keydown', keyDown );
                

				window.addEventListener( 'resize', onWindowResize );
                
                //para separar mi navegación en otro js
              //  setcamera(camera);

			}

            function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );

			}
            function zoom(fov)
            {
       	        
                camera.fov = THREE.MathUtils.clamp( fov, 10, 75 );
				camera.updateProjectionMatrix();         
                
            }
  
         
            function onDocumentMouseWheel( event ) {

				var fov = camera.fov + event.deltaY * 0.05;
                console.log(" event.deltaY: "+event.deltaY+" camera.fov "+camera.fov);
                zoom(fov);
			}
			function onMouseMove(){
				
				mousePointer.x =( event.clientX / window.innerWidth)*2-1;
                mousePointer.y =- ( event.clientY / window.innerHeight ) * 2 + 1;
				//console.log(mousePointer);	
                raycaster.setFromCamera(mousePointer, camera);
                let intersects = raycaster.intersectObjects( scene.children );
				let foundSprite = false;

				intersects.forEach(function(intersect){
					if (intersect.object.type == 'Sprite'){
						let p= intersect.object.position.clone().project(camera);
						boxInfo.style.top= ((-1*p.y+1)* window.innerHeight/2) + 'px';
						boxInfo.style.left= ((p.x +1)* window.innerWidth/2) + 'px';
						//boxInfo.style.display= 'block';
						boxInfo.classList.add('is-active');
						boxInfoActive = true;
						//console.log(p);
						foundSprite = true;
					}
				})
				if(foundSprite === false && boxInfoActive)
				{
					boxInfo.classList.remove('is-active');
				}

			}
			function animate() {

				requestAnimationFrame( animate );
				update();

			}
//el nombre del objeto que lanza el evento indica la posición en el arreglo de sonidos
			function clickSound()
            {
                console.log(" clickSound "+objectSelected);
                if(objectSelected)
				{
					if(audio)
					{
						audio.pause();
					}
                    audio = new Audio(audios[objeto.name]);
					audio.play();
	
					//console.log(" objeto.name "+objeto.name); 
					intersectsSound = null;//debe haber una mejor manera de limpiar este valor
					objectSelected = 0;
				}
				                //window.open(page,"_self");
               
            }
			function clickLink()
            {

				intersectsLinks = null;//debe haber una mejor manera de limpiar este valor
				objectSelected = 0;
				var page = links[objeto.name];
				window.open(page,"_self");
               
            }

			function update() {


				var lat = Math.max( - 85, Math.min( 85, getlat() ) );
				phi = THREE.MathUtils.degToRad( 90 - lat );
				theta = THREE.MathUtils.degToRad( getlon() );

				var x = 500 * Math.sin( phi ) * Math.cos( theta );
				var y = 500 * Math.cos( phi );
				var z = 500 * Math.sin( phi ) * Math.sin( theta );
               // console.log(" update  posoción x "+x+" y "+y+" z "+z);
				
                //----colisiones-------------------------------------
                mousePointer.x =getPointer()[0];// getPointer porque esta en otro archivo js las funiones para interacción, se llena en onPointerDown no solo al mover
                mousePointer.y =getPointer()[1];
                raycaster.setFromCamera(mousePointer, camera);
               // intersectsLinks = raycaster.intersectObjects( linkCollitions );
                intersectsSound = raycaster.intersectObjects( soundCollitions );
                
                if(intersectsSound.length && isUserClicking ){
                                   //me quedo con el primero en la lista ignoro todo el arreglo de objetos
					objeto= intersectsSound[0].object;
					objectSelected= 1;
					console.log(" update  objeto "+objeto);
                    if(inicializando)//porque al cargar se genera una colisión 
                    {
                       inicializando=0; 
                    }
                    else {
                        /*
                      xObject =   objeto.position.x;
                      yObject =   objeto.position.y;
                      zObject =   objeto.position.z;
                      //camera.lookAt( xObject, yObject, zObject ); 

                        x = objeto.position.x;
                        y =   objeto.position.y;
                        z =   objeto.position.z;*/
                        clickSound();   
                    }
                   
					//efecto de zoom sobre el objeto
                }
                camera.lookAt( x, y, z ); //no se está usando orbit controls, se calcula con el movimiento del mouse
                //sel look at, no deja fija esa posición, hay que modificar lat, phi y theta
                 
                //------------animación de la cámara---------------
      /*
           
                if(objectSelected)
                {
                   
                    if(nZoom<40)
                    {
                      // camera.zoom= camera.zoom+3;
                         //  camera.position.x= camera.position.x+3;
                       camera.fov=camera.fov-0.5;
                       zoom(camera.fov);
                       setTimeout(2000);
                        nZoom++; 
                        
                    }
                    else if (nZoom>=40){
                        
                        nZoom=0;
                    }
                }
         */      

                
				renderer.render( scene, camera );

			}

		</script>
